<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=1.0">
    <title>Mercury</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/estilos.css">
    <!-- <link rel="stylesheet" href="/css/estilo2.css"> -->

</head>

<body>
    <!-- Contenedor Principal -->
    <div class="contenedor">
        <!-- Contenedor de Logo Principal -->
        <div class="contenedor-logo">
            <div>
                <img src="./img/mercurylogo.png" alt="">
            </div>
        </div>
        <!-- Seccion Formulario -->
        <section class="formulario">
            <div class="contenedor-formulario">
                <!-- Contenedor De Logo Secundario -->
                <div class="contenedor-logo-secundario">
                    <img src="./img/mercurylogo.png" alt="">
                </div>
                <!-- Contenedor De Botones -->
                <div class="botones">
                    <div class="boton">
                        <a href="index.html">Inicia Sesión</a>
                    </div>
                    <div class="boton">
                        <a href="">Registrate</a>
                    </div>
                </div>
                <!-- Formulario -->
                <form action="">
                    <!-- Usuario -->
                    <div class="users">
                        <label for="name">Usuario</label>
                        <input type="text" name="nombre" id="name" placeholder="@usuario">
                        <div class="grupo__input form-group">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>
                    <!-- Contraseña -->
                    <div class="contraseña">
                        <label for="password">Contraseña</label>
                        <input type="password" name="password" id="password" placeholder="********">
                        <div class="grupo__input">
                            <i class="fa-solid fa-lock"></i>
                        </div class="">
                    </div>
                </form>
                <!-- Recuerda Y Restaurar -->
                <div class="mas-opciones">
                    <!-- Recuerda -->
                    <div class="recuerdame">
                        <input type="checkbox" name="recuerdame" id="recuerdame">
                        <label for="recuerdame">Recuerdame</label>
                    </div>
                    <!-- Restaurar -->
                    <div class="restaurar">
                        <p>¿Olvido su <a href="">Contraseña</a>?</p>
                    </div>
                </div>
                <!-- Enviar Formulario -->
                <input type="submit" value="Iniciar" class="submit">
                <!-- Inicio Exterior -->
                <div class="inicio-externo">
                    <p>Inicia Con</p>
                    <div class="cnt-icon">
                        <div>
                            <i class="fa-brands fa-google-plus-g"></i>
                        </div>
                        <div>
                            <i class="fa-brands fa-facebook-f"></i>
                        </div>
                        <div>
                            <i class="fa-brands fa-twitter"></i>
                        </div>
                    </div>
                </div>
                <div>
                    <p class="footer">&copy; Todos los derechos reservados por <a href="#">Mercury</a></p>
                </div>
            </div>

        </section>

    </div>


    <!-- Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"
        integrity="sha512-pumBsjNRGGqkPzKHndZMaAG+bir374sORyzM3uulLV14lN5LyykqNk8eEeUlUkB3U0M4FApyaHraT65ihJhDpQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/js/all.min.js"></script>
    <script src="/js/prefixfree.min.js"></script>
</body>

</html>
